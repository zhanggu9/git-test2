services:
  backend:
    image: ${BACKEND_IMAGE:-investment-analysis-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: investment_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: investment_docs
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://api.openai.com/v1}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      BOK_API_KEY: ${BOK_API_KEY:-}
      KRX_API_KEY: ${KRX_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - mongo
      - qdrant

  docs-index:
    image: ${BACKEND_IMAGE:-investment-analysis-backend:latest}
    command: ["bash", "/app/scripts/upload_docs_to_qdrant.sh"]
    environment:
      DOCS_DIR: /app/docs
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: investment_docs
    depends_on:
      - qdrant

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
