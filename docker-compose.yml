services:
  backend:
    image: investment-analysis-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./app/backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: investment_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: investment_docs
      RAG_EMBEDDING_PROVIDER: hash
      RAG_EMBEDDING_URL: ${RAG_EMBEDDING_URL:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://api.openai.com/v1}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      BOK_API_KEY: ${BOK_API_KEY:-}
      KRX_API_KEY: ${KRX_API_KEY:-}
    volumes:
      - ./docs:/app/docs:ro
      - ./.key:/app/.key:ro
    depends_on:
      - mongo
      - qdrant

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  quiz-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bash", "/app/scripts/init_quiz_mongodb.sh"]
    env_file:
      - ./app/backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: investment_db
    volumes:
      - ./quiz_questions.json:/app/quiz_questions.json:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - mongo

  docs-index:
    image: investment-analysis-backend:latest
    command: ["bash", "/app/scripts/upload_docs_to_qdrant.sh"]
    environment:
      DOCS_DIR: /app/docs
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: investment_docs
      RAG_EMBEDDING_PROVIDER: hash
    volumes:
      - ./docs:/app/docs:ro
      - ./scripts/upload_docs_to_qdrant.sh:/app/scripts/upload_docs_to_qdrant.sh:ro
    depends_on:
      - qdrant

volumes:
  mongo_data:
  qdrant_data:
